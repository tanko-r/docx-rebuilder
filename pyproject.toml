[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-rebuilder"
version = "1.0.0"
description = "Magically fix Word document formatting for lawyers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DOCX Rebuilder Team"}
]
keywords = ["docx", "word", "formatting", "legal", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: XML",
]

dependencies = [
    "python-docx>=1.1.0",
    "lxml>=4.9.0",
    "click>=8.1.0",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.0",
    "reportlab>=4.0.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
docx-rebuilder = "main:cli"

[project.urls]
Homepage = "https://github.com/docx-rebuilder/docx-rebuilder"
Documentation = "https://github.com/docx-rebuilder/docx-rebuilder#readme"
Repository = "https://github.com/docx-rebuilder/docx-rebuilder"

[tool.setuptools.packages.find]
include = ["docx_rebuilder*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
